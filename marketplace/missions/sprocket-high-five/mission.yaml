mission_id: "01"
version: "3.2.1"
title: Teach a Robot Dog to High-Five with KinematicsSolver
thumbnail: thumbnail.png
objective: >
  Sprocket is a robot dog, powered down on a maintenance stand, and your job
  is to teach him to give a high-five. A machine like Sprocket is a set of
  rigid parts connected by joints, and each joint angle is a single number.
  The Simscape Multibody KinematicsSolver works out how those joint angles and
  the position of his paw depend on each other. Forward kinematics asks where
  the paw ends up for joint angles that you choose. Inverse kinematics asks
  which joint angles put the paw on a point that you choose. By the end you
  will have imported Sprocket from his Computer-Aided Design (CAD) files,
  solved both problems, and picked the answer that his real joints can reach.
  This mission assumes that you know MATLAB: variables, tables, indexing,
  loops and plotting. It assumes no knowledge of Simscape Multibody, robotics
  or CAD, so you are never expected to know one of their functions in advance.
  How you will work: you work in a live script named sprocket_high_five.m,
  which opens when the mission starts. Ada gives you one task at a time,
  14 in all, and tells you what to do and why. The section of that task
  in the live script gives the background, explains the function that you
  need, and has a place for your code. You type your code there, run the
  section, and tell Ada. She checks your work and gives you the next task.
  Ask Ada for a hint whenever you want the function explained again with the
  exact commands. The exact commands of every task are also in the Solutions
  section at the bottom of the live script. Before you begin, think
  about your own leg. When you bend your knee, does your foot move up or
  down?
supported_matlab_releases: [R2026a, R2026b]
required_capabilities: [MATLAB, Simulink, Simscape, Simscape Multibody, MATLAB MCP, Simulink Agentic Toolkit]
write_mode: read_inspect
capability_mode: guided_tutor
teaching_mode: guided_walkthrough

app:
  summary: Import a robot dog from CAD and solve forward and inverse kinematics to make it give a high-five.
  audience: MATLAB users with no Simscape Multibody, robotics or CAD background.
  difficulty: beginner
  estimated_minutes: 60
  products: [MATLAB, Simulink, Simscape, Simscape Multibody]
  topics: [kinematics, KinematicsSolver, forward kinematics, inverse kinematics, URDF import, initial guesses]
  status: draft
  learner_visible: true
  tile_order: 10

learning_outcomes:
  - id: lo01
    description: Import a URDF CAD assembly into a Simscape Multibody model and identify its joints.
  - id: lo02
    description: Create a KinematicsSolver object and match its joint variable IDs to the joints of the model.
  - id: lo03
    description: Define frame variables that measure the position of a point of interest relative to the world frame.
  - id: lo04
    description: Pose and solve a forward kinematics problem by assigning target and output variables.
  - id: lo05
    description: Pose and solve an inverse kinematics problem and read its status flag.
  - id: lo06
    description: Use initial guesses to choose between multiple solutions, check a solution against joint limits, and solve a smooth path.

setup:
  script: "setup_sprocket_high_five.m"
  description: >
    Finds the Sprocket CAD files that ship in the task_reset folder and writes
    Sprocket.urdf into the learner workspace with full paths to the part
    geometry, so the import works from any current folder. Leaves two
    variables in the MATLAB workspace: urdfFile, the full path of that URDF
    file, and padPosition, the 1-by-3 point in metres (world frame) that the
    paw centre must reach. It also copies the live script sprocket_high_five.m
    into the learner workspace, opens it in the Live Editor, and leaves its
    full path in the variable scriptFile. The live script holds the
    instructions and an empty code area for every task. No model is created
    and no solver exists yet.
    Construction variables are cleared. Run via run_matlab_file at session
    start.

runtime_validation:
  setup:
    assertions:
      - type: workspace_var
        name: padPosition
        class: double
      - type: workspace_var
        name: urdfFile
        class: string
      - type: matlab_expression
        description: The staged URDF file exists
        code: "isfile(urdfFile)"
      - type: matlab_expression
        description: The live script was copied into the workspace
        code: "isfile(scriptFile)"
      - type: workspace_absent
        name: cadFolder
  resets:
    - task: t02
      assertions:
        - type: model_loaded
          name: Sprocket
        - type: block_exists
          path: Sprocket/fl_knee
        - type: block_exists
          path: Sprocket/World
    - task: t04
      assertions:
        - type: workspace_var
          name: ks
          class: simscape.multibody.KinematicsSolver
    - task: t05
      assertions:
        - type: matlab_expression
          description: Three leg joint IDs are stored
          code: "numel(legIDs) == 3"
    - task: t06
      assertions:
        - type: matlab_expression
          description: Three Paw frame variables exist
          code: "height(frameVariables(ks)) == 3"
    - task: t07
      assertions:
        - type: matlab_expression
          description: Three paw IDs are stored
          code: "numel(pawIDs) == 3"
    - task: t09
      assertions:
        - type: matlab_expression
          description: Forward kinematics is posed with three targets and three outputs
          code: "height(targetVariables(ks)) == 3 && height(outputVariables(ks)) == 3"
        - type: matlab_expression
          description: The stance paw position matches the reference
          code: "norm(reshape(pawStance, 1, []) - [0.22 0.16 0.1829]) < 1e-3"
    - task: t11
      assertions:
        - type: matlab_expression
          description: Inverse kinematics has been solved once
          code: "numel(qFirst) == 3 && all(isfinite(qFirst))"
    - task: t12
      assertions:
        - type: matlab_expression
          description: Initial guess variables are assigned
          code: "height(initialGuessVariables(ks)) >= 2"
        - type: matlab_expression
          description: The high-five pose is on the knee-back branch
          code: "abs(qHighFive(3) + 103.08) < 0.1"
    - task: t14
      assertions:
        - type: matlab_expression
          description: The path has one row of joint angles for each point
          code: "isequal(size(qPath), [25 3]) && all(qPath(:, 3) < 0)"

discovery:
  model_name:
    tool: evaluate_matlab_code
    code: "bdroot"
    note: >
      The learner imports the model and may give it any name. The default is
      Sprocket. Use bdroot or find_system('type','block_diagram') to discover
      it, or read the ModelName property of the learner's KinematicsSolver
      object once it exists. Use the discovered name in every block path.

# Notes for the tutor (Ada):
#
# Who the learner is. The learner knows MATLAB: variables, tables, indexing,
# loops and plotting. The learner does not know Simscape Multibody, robotics
# or CAD. Do not explain basic MATLAB. Do explain every Simscape Multibody
# function, every Simulink action and every mechanical term.
#
# Teaching style. The line teaching_mode: guided_walkthrough above marks this
# mission as a guided walkthrough.
# - You give the task. The instruction of every task is the task
#   description: what to do, then why, in words. It contains no commands on
#   purpose, so there is nothing in it to hold back. Present it in full and
#   keep every name and value that it contains, in code formatting. Then ask
#   its question, if it has one.
# - The live script teaches. The setup script opens a live script named
#   sprocket_high_five.m in the learner's Live Editor. It has one section for
#   each task, under the headings Task 1 to Task 14. Each section has
#   Background, The function with its general syntax, Why, and an empty code
#   area where the learner types. Point the learner to the heading of the
#   current task, and never assume that they know which function to use or
#   where to click.
# - In your opening, tell the learner how to work: you give one task at a
#   time, they read the section of that task in the live script, type their
#   code there, run the section, and tell you.
# - The first hint of every task repeats the function, the reason, the task
#   and the exact commands. Give it as soon as the learner asks, hesitates or
#   reports an error. If the learner says that they are new, treat that as a
#   standing request for the first hint of every task.
# - The exact commands of every task are also in the Solutions section at
#   the very bottom of the live script. Encourage the learner to try first.
#   Offer the first hint before you send them to the Solutions.
# - The live script is the learner's own file, in the workspace folder. It
#   is saved as plain text, so you can read the learner's code in it when
#   they ask for help. Do not edit it.
# - The learner may do several tasks in the live script before talking to you.
#   When you check a task, also look whether the next tasks are already
#   done, and move the learner forward without asking them to redo anything.
# - Keep each check quick. The tasks are small on purpose, and a learner who
#   waits a long time after every command loses the thread.
# - In MATLAB means the code area of the task in the live script. In
#   Simulink means the window that shows the Sprocket block diagram.
# - After every solve the learner looks at Sprocket with viewSolution. If
#   they skip it, remind them, because seeing the pose is the point.
# - Ask fair questions only. A fair question has one idea, and the learner
#   can answer it from what this mission has already shown them or from
#   everyday experience. Ask one question at a time. If the learner
#   hesitates, offer two or three choices. For the opening prediction, use
#   the question at the end of the objective, about bending a knee. Do not
#   ask what the solver will do.
# - When an answer is not right, never just say that it is wrong. Explain in
#   one or two supportive sentences why the right answer is right, then
#   invite the learner to try again or to move on.
# - A question about what a word means is not a hint request. Answer it in
#   full, in everyday language, at any time. Introduce a new term in four
#   moves: name it, define it, relate it to something familiar, then show
#   where it appears in Sprocket's model. Useful definitions:
#     part (also body or link). One rigid piece that does not bend.
#     joint. The place where two parts meet and can move. A revolute joint
#       is a hinge with one angle. A weld joint allows no motion.
#     degrees of freedom (DOF). The number of independent ways to move. A
#       leg with three hinges has three.
#     pose. The full list of joint angles at one moment.
#     frame. A coordinate system attached to a part, an origin and x, y, z.
#     world frame. The frame that never moves. Here it sits on the floor
#       under the middle of Sprocket's body, x forward, y to his left, z up.
#     kinematics. The geometry of motion, with no forces or motors.
#     forward kinematics. Joint angles in, position out. One answer.
#     inverse kinematics. Position in, joint angles out. The solver finds it
#       by search, and there can be more than one answer.
#     target, output, initial guess. The three roles of a solver variable.
#       A value you supply, a value you want, and where the search starts.
#     status flag. How the search went. 1 means every target was met.
# - When a task is complete, congratulate the learner in a few words, give a
#   one-sentence takeaway in their terms, and link it to the next task.
# - Write to the learner as "you", in active voice, and use no jargon that
#   this mission has not explained.
#
# Checking the work.
# - Every check below can be answered with evaluate_matlab_code. Find the
#   learner's solver by class (simscape.multibody.KinematicsSolver), not by
#   variable name, and inspect it with jointPositionVariables,
#   frameVariables, targetVariables, outputVariables and
#   initialGuessVariables. These calls only read the solver.
# - Reference answers come from an independent calculation on the same URDF.
#   Lengths are in metres, angles in degrees. Treat them as sanity anchors
#   and judge the learner's formulation first.
# - The solver ignores joint limits. That is the point of the knee tasks, so
#   do not reveal it before the learner reaches them.
# - Calling solve yourself changes which pose viewSolution shows. If you call
#   it to verify, say so, or re-run the learner's last solve afterwards.

tasks:
  - id: "t01"
    title: Import Sprocket with smimport
    involves: [command]
    outcome_refs: [lo01]
    instruction: >
      Your task, in MATLAB: import the robot description of Sprocket. Its
      location is in the variable `urdfFile`. You only need to import once.

      Why: The solver that you will use works on a Simscape Multibody model, so
      Sprocket has to become one first.

      Before you start, read Background and The function in the section Task 1
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            a block diagram imported from Sprocket.urdf is loaded: list models
            with find_system("type","block_diagram") and confirm one of them
            has top-level blocks named World, fl_hip_abduct, fl_hip_pitch,
            fl_knee and fl_foot (for example with getSimulinkBlockHandle);
            accept any model name
        - tool: model_overview
          check: >
            the imported model's top level shows link subsystems connected by
            joint blocks; if the model tools cannot describe physical-network
            blocks, rely on the evaluate_matlab_code evidence instead of
            failing the task
      description: >
        Sprocket.urdf has been imported as a loaded Simscape Multibody model.
    hints:
      - >
        The function: `smimport` imports a robot description into Simscape
        Multibody. You give it the location of a URDF file, and it builds a
        Simulink model with one block for each part and one block for each
        joint. The mission setup stored the location of the file in the
        variable `urdfFile`. After a few seconds, a Simulink window named
        Sprocket opens. Why: The solver that you will use works on a Simscape
        Multibody model, so Sprocket has to become one first. Your task, in
        MATLAB: import the robot description of Sprocket. Its location is in
        the variable `urdfFile`. You only need to import once. Type
        `smimport(urdfFile)` in the code area of this task in your live script,
        then run the section with `Ctrl+Enter`.
      - >
        If MATLAB says that `urdfFile` does not exist, tell me and I will run
        the mission setup again. Pass `urdfFile` as a variable, with no quotes
        around it.
      - >
        When the import works, a Simulink window named Sprocket opens. It shows
        a diagram of blocks joined by lines. Tell me when you can see it.

  - id: "t02"
    title: Look at Sprocket and find the leg joints
    involves: [configuration, output_interpretation]
    outcome_refs: [lo01]
    instruction: >
      Your task, in Simulink: click an empty area of the Sprocket model window
      and press `Ctrl+D` (`Cmd+D` on a Mac) to see Sprocket in 3D. Then go back
      to the block diagram and find the four joint blocks whose names start
      with `fl_`.

      Why: Seeing the robot makes every later task easier to picture. The
      joints of the front-left leg are the ones that you will drive for the
      rest of the mission.

      Before you start, read Background and What to look for in the section
      Task 2 of your live script, sprocket_high_five.m.

      Then answer this: Three of those four joints are hinges that move the
      leg, and one is a rigid weld that only holds the paw on. Think about your
      own leg. Which three do you think are the hinges?
    completion:
      strategy:
        - kind: learner_confirmation
          check: >
            The learner has named the three joints of the front-left leg:
            fl_hip_abduct, fl_hip_pitch and fl_knee. Accept an answer in their
            own words that identifies all three.
      description: >
        The learner has seen Sprocket in 3D and identified the three hinges of
        the front-left leg.
    hints:
      - >
        What to look for: Multibody Explorer shows Sprocket on his stand, with
        a round pad in front of him. In the block diagram, every part is a
        subsystem block, and every joint is a block that sits between two
        parts. The blocks of the front-left leg have names that start with
        `fl_`. Four of them are joints: `fl_hip_abduct`, `fl_hip_pitch`,
        `fl_knee` and `fl_foot`. Why: Seeing the robot makes every later task
        easier to picture. The joints of the front-left leg are the ones that
        you will drive for the rest of the mission. Your task, in Simulink:
        click an empty area of the Sprocket model window and press `Ctrl+D`
        (`Cmd+D` on a Mac) to see Sprocket in 3D. Then go back to the block
        diagram and find the four joint blocks whose names start with `fl_`.
      - >
        If nothing happens when you press `Ctrl+D`, click once on an empty
        white area of the block diagram first, so that the window is selected.
        You can also open the Modeling tab and select Update Model. Each joint
        name says what the joint does: `fl_hip_abduct` swings the whole leg
        sideways, `fl_hip_pitch` swings it forward and back, and `fl_knee`
        bends the lower leg.
      - >
        The joint `fl_foot` is the weld that holds the paw on. So the three
        hinges are `fl_hip_abduct`, `fl_hip_pitch` and `fl_knee`. Tell me those
        three names.

  - id: "t03"
    title: Create the solver with KinematicsSolver
    involves: [command]
    outcome_refs: [lo02]
    instruction: >
      Your task, in MATLAB: create a solver for the model named Sprocket and
      store it in a variable named `ks`.

      Why: Every other function in this mission takes this object as its first
      input.

      Before you start, read Background and The function in the section Task 3
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            the base workspace holds a simscape.multibody.KinematicsSolver
            object whose ModelName is a currently loaded model; find it by
            class with whos and do not require a particular variable name
      description: >
        A KinematicsSolver object exists for the imported model.
    hints:
      - >
        The function: `simscape.multibody.KinematicsSolver` creates the solver
        object. You give it the name of a loaded model. It takes a snapshot of
        the parts and joints of that model, and it does not run a simulation.
        Why: Every other function in this mission takes this object as its
        first input. Your task, in MATLAB: create a solver for the model named
        Sprocket and store it in a variable named `ks`. Type
        `ks = simscape.multibody.KinematicsSolver("Sprocket");` in the code
        area of this task in your live script, then run the section with
        `Ctrl+Enter`.
      - >
        If MATLAB reports an error, check that the Sprocket window is still
        open and that the name in quotes matches its title. If you renamed the
        model, use your own name in place of Sprocket.
      - >
        When it works, nothing is printed. Display `ks` if you want to see a
        summary of the solver.

  - id: "t04"
    title: Find the leg joints with jointPositionVariables
    involves: [command, output_interpretation]
    outcome_refs: [lo02]
    instruction: >
      Your task, in MATLAB: list the joint position variables in a table named
      `T`. Then store the IDs of the three front-left leg joints, in the order
      hip abduction, hip pitch, knee, in a variable named `legIDs`.

      Why: The solver functions take lists of IDs as inputs. Storing the three
      leg IDs once saves you from looking them up in every later task.

      Before you start, read Background and The function in the section Task 4
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.

      Then answer this: Look at the `Unit` column of the table. Which unit does
      the solver use for joint angles?
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            legIDs exists and holds exactly three IDs; look each one up in the
            table returned by jointPositionVariables for the learner's solver
            and confirm the BlockPath values end with fl_hip_abduct,
            fl_hip_pitch and fl_knee in that order; never assume the IDs are
            j1, j2, j3
        - kind: learner_confirmation
          check: >
            The learner states that joint position variables are in degrees by
            default.
      description: >
        legIDs holds the variable IDs of the three front-left leg joints in
        order.
    hints:
      - >
        The function: `jointPositionVariables` returns a table with one row for
        each joint angle. The `ID` column holds the ID that the solver uses.
        The `BlockPath` column names the joint block in the model that the
        angle belongs to. The `Unit` column gives the unit. The rows whose
        `BlockPath` ends in `fl_hip_abduct`, `fl_hip_pitch` and `fl_knee`
        belong to the front-left leg. They are normally rows 1 to 3. Why: The
        solver functions take lists of IDs as inputs. Storing the three leg IDs
        once saves you from looking them up in every later task. Your task, in
        MATLAB: list the joint position variables in a table named `T`. Then
        store the IDs of the three front-left leg joints, in the order hip
        abduction, hip pitch, knee, in a variable named `legIDs`. Type
        `T = jointPositionVariables(ks)`, then `legIDs = T.ID(1:3)` in the code
        area of this task in your live script, then run the section with
        `Ctrl+Enter`.
      - >
        Check that the `BlockPath` values of rows 1 to 3 end in
        `fl_hip_abduct`, `fl_hip_pitch` and `fl_knee`, in that order. If the
        three joints are on other rows, index those rows instead, for example
        `legIDs = T.ID([4 5 6])`.
      - >
        The table has 13 rows, one for each joint that can move. `legIDs` holds
        three IDs, such as `j1.Rz.q`, `j2.Rz.q` and `j3.Rz.q`. The `Unit`
        column shows `deg`, which means degrees.

  - id: "t05"
    title: Measure the paw with addFrameVariables
    involves: [command, configuration]
    outcome_refs: [lo03]
    instruction: >
      Your task, in MATLAB: add frame variables that measure the translation of
      the paw frame, `Sprocket/fl_foot/F`, from the world frame,
      `Sprocket/World/W`. Use the group name `Paw`.

      Why: A high-five is about where the paw is, so the solver needs variables
      for the position of the paw.

      Before you start, read Background and The function in the section Task 5
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            frameVariables for the learner's solver lists three translation
            variables (x, y, z, in metres) whose Base is the W port of the
            World block and whose Follower is a frame at the paw centre: the F
            or B port of the fl_foot joint, or an equivalent frame port on the
            fl_paw subsystem; accept any valid group name; do not accept a
            follower on another leg or on the knee joint
      description: >
        The solver has three translation frame variables that locate the
        front-left paw from the world frame.
    hints:
      - >
        The function: `addFrameVariables` tells the solver to measure one
        frame, called the *follower*, from another frame, called the *base*.
        Its inputs are the solver, a group name of your choice, the kind of
        measurement, the base frame and the follower frame. The kind
        `"translation"` gives three variables: the distances along x, y and z.
        You write each frame as a path: the model name, the block name and the
        port name, with slashes between them. The world frame is
        `"Sprocket/World/W"`, and the paw frame is `"Sprocket/fl_foot/F"`. Why:
        A high-five is about where the paw is, so the solver needs variables
        for the position of the paw. Your task, in MATLAB: add frame variables
        that measure the translation of the paw frame, `Sprocket/fl_foot/F`,
        from the world frame, `Sprocket/World/W`. Use the group name `Paw`.
        Type
        `addFrameVariables(ks,"Paw","translation","Sprocket/World/W","Sprocket/fl_foot/F");`
        in the code area of this task in your live script, then run the section
        with `Ctrl+Enter`.
      - >
        If MATLAB reports an error, the usual cause is a path that does not
        match a block. Check the spelling and the capital letters. If you
        renamed your model, replace Sprocket at the start of both paths with
        your model name.
      - >
        When it works, nothing is printed. The next task shows you what was
        created.

  - id: "t06"
    title: Check the measurement with frameVariables
    involves: [command, output_interpretation]
    outcome_refs: [lo03]
    instruction: >
      Your task, in MATLAB: list the frame variables in a table named `F`. Then
      store the three paw IDs, in the order x, y, z, in a variable named
      `pawIDs`.

      Why: The table confirms what you created. Its `ID` column is also the
      list that stands for the position of the paw in every later task, just as
      `legIDs` stands for the leg angles.

      Before you start, read Background and The function in the section Task 6
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.

      Then answer this: If Sprocket lifts his paw straight up, which of those
      three numbers changes: x, y or z?
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            pawIDs exists and holds exactly the three Paw translation IDs of
            the learner's solver, in the order x, y, z; accept a string array,
            a cell array or a table column
        - kind: learner_confirmation
          check: >
            The learner says that z changes when the paw moves straight up. The
            reason is that the z axis of the world frame points up. If the
            learner picks x or y, explain that kindly and move on.
      description: >
        pawIDs holds the IDs of the three paw translation variables, and the
        learner knows which one measures height.
    hints:
      - >
        The function: `frameVariables` returns a table of the frame variables
        of the solver. The `ID` column holds their IDs, and the `Base` and
        `Follower` columns show the two frames of each measurement. You should
        see `Paw.Translation.x`, `Paw.Translation.y` and `Paw.Translation.z`,
        in metres. Why: The table confirms what you created. Its `ID` column is
        also the list that stands for the position of the paw in every later
        task, just as `legIDs` stands for the leg angles. Your task, in MATLAB:
        list the frame variables in a table named `F`. Then store the three paw
        IDs, in the order x, y, z, in a variable named `pawIDs`. Type
        `F = frameVariables(ks)`, then `pawIDs = F.ID` in the code area of this
        task in your live script, then run the section with `Ctrl+Enter`.
      - >
        If the table is empty, the frame variables were not added. Go back one
        task and run the `addFrameVariables` command again. If `F` holds more
        than three rows, keep only the three `Paw` rows in `pawIDs`.
      - >
        You should see three rows, and `pawIDs` should hold their three IDs.
        The answer to the question is z, because the z axis of the world frame
        points up.

  - id: "t07"
    title: Set up the forward problem with addTargetVariables and addOutputVariables
    involves: [command]
    outcome_refs: [lo04]
    instruction: >
      Your task, in MATLAB: make the three leg angles in `legIDs` the targets
      and the three paw variables in `pawIDs` the outputs.

      Why: The roles tell the solver which problem to solve. In the forward
      problem, the leg angles are what you know and the position of the paw is
      what you want.

      Before you start, read Background and The function in the section Task 7
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            targetVariables for the learner's solver lists exactly the three
            front-left leg joint position variables, and outputVariables lists
            the three Paw translation variables
      description: >
        The leg joint angles are targets and the paw translation variables are
        outputs.
    hints:
      - >
        The function: `addTargetVariables` marks variables as targets, and
        `addOutputVariables` marks variables as outputs. Each takes the solver
        and a list of variable IDs. You supply the values of the targets when
        you solve, and the solver returns the values of the outputs. Why: The
        roles tell the solver which problem to solve. In the forward problem,
        the leg angles are what you know and the position of the paw is what
        you want. Your task, in MATLAB: make the three leg angles in `legIDs`
        the targets and the three paw variables in `pawIDs` the outputs. Type
        `addTargetVariables(ks,legIDs);`, then `addOutputVariables(ks,pawIDs);`
        in the code area of this task in your live script, then run the section
        with `Ctrl+Enter`.
      - >
        If MATLAB says that `legIDs` or `pawIDs` does not exist, go back and
        store those IDs again. If it says that a variable already has a role,
        run `clearTargetVariables(ks); clearOutputVariables(ks);` and try
        again.
      - >
        When it works, nothing is printed. Display `targetVariables(ks)` and
        `outputVariables(ks)` to see the three targets and the three outputs.

  - id: "t08"
    title: Solve the forward problem with solve and viewSolution
    involves: [command, output_interpretation]
    outcome_refs: [lo04]
    instruction: >
      Your task, in MATLAB: first make a prediction. With the leg hanging
      straight, the paw is as low as it can go. Will bending the joints make
      the paw end up higher or lower? Then solve for the ready stance, with the
      target values 0, 40 and -80 degrees, and store the paw position in a
      variable named `pawStance`. Finish by opening the viewer to look at the
      front-left leg.

      Why: The call to `solve` answers the forward problem: where is the paw in
      the ready stance? The viewer lets you check that answer with your own
      eyes, so use it after every solve from now on.

      Before you start, read Background and The function in the section Task 8
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.

      Then answer this: Hanging straight, the paw was at a height of z = 0.08
      metres. Compare that with the third number in `pawStance`. Was your
      prediction right?
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            pawStance is a three-element numeric vector within 1 mm of
            [0.2200 0.1600 0.1829] metres; to judge the formulation rather than
            the stored numbers you may call solve on the learner's solver with
            the targets 0, 40 and -80 in the order shown by targetVariables and
            expect a status flag of 1
        - kind: learner_confirmation
          check: >
            The learner compares the third number of pawStance, about 0.18,
            with the hanging height of 0.08 and says that the paw is higher.
            Accept any answer that recognises the paw rose. Then share the rest
            as a takeaway instead of asking for it: the paw rose by about 0.10
            m and stayed directly below the hip, so x and y did not change.
      description: >
        pawStance holds the solved paw position for the ready stance, and the
        learner has seen the pose.
    hints:
      - >
        The function: `solve` runs the solver. Its inputs are the solver and
        the values of the targets, in the same order as the target list. It
        returns the values of the outputs, and then a *status flag*. A status
        of 1 means that the solver met every target. A negative status means
        that it could not. `viewSolution` opens the Kinematics Solver Viewer, a
        3D window that shows the pose from the last call to `solve`. Why: The
        call to `solve` answers the forward problem: where is the paw in the
        ready stance? The viewer lets you check that answer with your own eyes,
        so use it after every solve from now on. Your task, in MATLAB: first
        make a prediction. With the leg hanging straight, the paw is as low as
        it can go. Will bending the joints make the paw end up higher or lower?
        Then solve for the ready stance, with the target values 0, 40 and -80
        degrees, and store the paw position in a variable named `pawStance`.
        Finish by opening the viewer to look at the front-left leg. Type
        `[pawStance,status] = solve(ks,[0 40 -80])`, then `viewSolution(ks)` in
        the code area of this task in your live script, then run the section
        with `Ctrl+Enter`.
      - >
        The values that you give to `solve` must be in the same order as the
        targets. Display `targetVariables(ks)` to see that order. It should
        list hip abduction, hip pitch and knee, so the values are 0, 40 and
        -80.
      - >
        You should get a status of 1 and a paw position close to 0.22, 0.16 and
        0.18 metres. The viewer shows the front-left knee bent and the paw
        about 0.10 metres higher than when it hangs.

  - id: "t09"
    title: Swap the roles with clearTargetVariables and clearOutputVariables
    involves: [command]
    outcome_refs: [lo05]
    instruction: >
      Your task, in MATLAB: clear the roles. Then make the three paw variables
      in `pawIDs` the targets and the three leg angles in `legIDs` the outputs.

      Why: A variable can have only one of these two roles at a time. In the
      inverse problem, the position of the paw is what you know and the leg
      angles are what you want.

      Before you start, read Background and The function in the section Task 9
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            targetVariables for the learner's solver lists exactly the three
            Paw translation variables and outputVariables lists the three
            front-left leg joint position variables, so the roles from the
            forward problem have been cleared and swapped
      description: >
        The paw translation variables are targets and the leg joint angles are
        outputs.
    hints:
      - >
        The function: `clearTargetVariables` and `clearOutputVariables` remove
        the target and output roles from all variables. Each takes only the
        solver as input. The variables themselves stay. You then assign the
        roles again with `addTargetVariables` and `addOutputVariables`, with
        the lists swapped. Why: A variable can have only one of these two roles
        at a time. In the inverse problem, the position of the paw is what you
        know and the leg angles are what you want. Your task, in MATLAB: clear
        the roles. Then make the three paw variables in `pawIDs` the targets
        and the three leg angles in `legIDs` the outputs. Type
        `clearTargetVariables(ks); clearOutputVariables(ks);`, then
        `addTargetVariables(ks,pawIDs); addOutputVariables(ks,legIDs);` in the
        code area of this task in your live script, then run the section with
        `Ctrl+Enter`.
      - >
        If MATLAB says that a variable already has a role, the old roles are
        still in place. Run the first line again, then the second.
      - >
        When it works, nothing is printed. Display `targetVariables(ks)` to
        check. It should list the three `Paw` variables.

  - id: "t10"
    title: Solve the inverse problem with solve and check the knee
    involves: [command, output_interpretation]
    outcome_refs: [lo05]
    instruction: >
      Your task, in MATLAB: solve for the point in `padPosition` and store the
      joint angles in a variable named `qFirst`. Then open the viewer and look
      at the front-left knee.

      Why: The result is the set of joint angles that the motors in the leg
      would have to reach. An answer that needs the knee to bend past its limit
      is useless on the real robot, and only you can spot it.

      Before you start, read Background and The function in the section Task 10
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.

      Then answer this: The knee angle is the third number in `qFirst`. Is it
      between -160 and +5 degrees?
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            qFirst is a three-element numeric vector; two answers are both
            correct here, close to [17.82 -14.45 -103.08] or
            [17.82 -117.53 103.08] degrees (allow 0.1 degree and full-turn
            wraps); if the learner's solve started from the straight-leg pose
            and returned a negative status flag, do not fail the task as long
            as the roles are right, because the next task fixes convergence
            with initial guesses
        - kind: learner_confirmation
          check: >
            The learner says whether the knee angle in qFirst is inside the
            range -160 to +5 degrees, and their answer matches the current
            value: a value near -103 is inside, and a value near +103 is
            outside. Accept a correct reading either way.
      description: >
        qFirst holds the joint angles the solver returned for the pad position,
        and the learner has compared the knee angle with its limit.
    hints:
      - >
        The function: `solve` works as before. The target values are now a
        position, so you give it `padPosition`. It returns the three leg angles
        in degrees, in the order hip abduction, hip pitch, knee, and then the
        status flag. A status of 1 means that the paw reached the target. A
        negative status means that the search stopped before it got there.
        `viewSolution` shows the pose where the search ended. Why: The result
        is the set of joint angles that the motors in the leg would have to
        reach. An answer that needs the knee to bend past its limit is useless
        on the real robot, and only you can spot it. Your task, in MATLAB:
        solve for the point in `padPosition` and store the joint angles in a
        variable named `qFirst`. Then open the viewer and look at the
        front-left knee. Type `[qFirst,status] = solve(ks,padPosition)`, then
        `viewSolution(ks)` in the code area of this task in your live script,
        then run the section with `Ctrl+Enter`.
      - >
        The target is now a position, so you pass the variable `padPosition`
        directly. If the status is negative, the search started from straight
        legs and lost its way. That is fine here, and the next task shows you
        how to guide it.
      - >
        A knee angle near -103 is inside the limit, so that answer is real. A
        knee angle near +103 is far outside the limit, so the real robot cannot
        reach that pose. Tell me which one you have.

  - id: "t11"
    title: Pick the reachable pose with addInitialGuessVariables
    involves: [command, output_interpretation]
    outcome_refs: [lo05, lo06]
    instruction: >
      Your task, in MATLAB: give the three leg angles in `legIDs` the initial
      guess role. Then solve for the point in `padPosition` again, with the
      guess 0, 40 and -80 degrees, and store the answer in a variable named
      `qHighFive`. Finish by looking at the pose in the viewer.

      Why: A search that starts near the answer that you want ends at that
      answer. The ready stance already has the knee bent backward, so it leads
      the search to the answer inside the joint limit.

      Before you start, read Background and The function in the section Task 11
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.

      Then answer this: Why can the same paw position have two different sets
      of joint angles? Use the fingertip and elbow example if it helps.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            initialGuessVariables for the learner's solver includes at least
            the front-left hip pitch and knee joint position variables
        - tool: evaluate_matlab_code
          check: >
            qHighFive is a three-element numeric vector within 0.1 degree of
            [17.82 -14.45 -103.08], in the order of the output table, so the
            knee angle is negative and inside the range -160 to +5 degrees
        - kind: learner_confirmation
          check: >
            The learner explains in their own words that a two-segment leg can
            reach the same point with the knee bent either way, so the paw
            position alone does not fix the joint angles. Accept the elbow
            comparison as a full answer.
      description: >
        qHighFive holds the knee-back solution that respects the knee joint
        limit.
    hints:
      - >
        The function: `addInitialGuessVariables` marks variables as initial
        guesses. Its inputs are the solver and a list of variable IDs. A
        variable can be an output and an initial guess at the same time.
        `solve` then takes the guess values as a third input, in the same order
        as the initial guess list. Why: A search that starts near the answer
        that you want ends at that answer. The ready stance already has the
        knee bent backward, so it leads the search to the answer inside the
        joint limit. Your task, in MATLAB: give the three leg angles in
        `legIDs` the initial guess role. Then solve for the point in
        `padPosition` again, with the guess 0, 40 and -80 degrees, and store
        the answer in a variable named `qHighFive`. Finish by looking at the
        pose in the viewer. Type `addInitialGuessVariables(ks,legIDs);`, then
        `[qHighFive,status] = solve(ks,padPosition,[0 40 -80])`, then
        `viewSolution(ks)` in the code area of this task in your live script,
        then run the section with `Ctrl+Enter`.
      - >
        The guess values go in the third input of `solve`, in the same order as
        `legIDs`. The answer should be close to 17.8, -14.5 and -103.1 degrees,
        with a status of 1.
      - >
        Two answers exist because a leg with two segments can reach the same
        point with the knee bent either way, just like your elbow. Tell me that
        in your own words.

  - id: "t12"
    title: Prepare the path points with linspace
    involves: [command]
    outcome_refs: [lo06]
    instruction: >
      Your task, in MATLAB: make 25 points on the straight line from
      `pawStance` to `padPosition` in a matrix named `pawPath`. Also make a
      matrix of zeros named `qPath` with one row for each point, and a variable
      named `guess` that holds the ready stance.

      Why: Each row of `pawPath` becomes the target of one inverse kinematics
      problem, and `qPath` collects the answers.

      Before you start, read Background and The function in the section Task 12
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            pawPath is numeric with three columns and at least 15 rows; its
            first row equals pawStance and its last row equals padPosition
            within 1 mm
        - tool: evaluate_matlab_code
          check: >
            qPath is numeric with three columns and as many rows as pawPath,
            and guess is a three-element numeric vector; accept a qPath that
            the loop of the next task has already filled
      description: >
        pawPath holds the straight-line path of the paw, qPath is ready for the
        answers, and guess holds a starting pose.
    hints:
      - >
        The function: this task uses plain MATLAB. `linspace` makes a column
        `s` of evenly spaced numbers from 0 to 1. Blending the two positions
        with `s` gives one row of `pawPath` for each point. `qPath` is a matrix
        of zeros for the answers, and `guess` holds the ready stance as the
        first starting pose. Why: Each row of `pawPath` becomes the target of
        one inverse kinematics problem, and `qPath` collects the answers. Your
        task, in MATLAB: make 25 points on the straight line from `pawStance`
        to `padPosition` in a matrix named `pawPath`. Also make a matrix of
        zeros named `qPath` with one row for each point, and a variable named
        `guess` that holds the ready stance. Type
        `n = 25; s = linspace(0,1,n)';`, then
        `pawPath = (1-s).*pawStance(:)' + s.*padPosition(:)';`, then
        `qPath = zeros(n,3); guess = [0 40 -80];` in the code area of this task
        in your live script, then run the section with `Ctrl+Enter`.
      - >
        If MATLAB says that `pawStance` does not exist, solve the forward
        problem again. If the sizes do not match, check that `s` is a column
        and not a row.
      - >
        When it works, nothing is printed. `size(pawPath)` and `size(qPath)`
        should both be 25 rows and 3 columns.

  - id: "t13"
    title: Solve every point with a for loop
    involves: [command, file_edit]
    outcome_refs: [lo06]
    instruction: >
      Your task, in MATLAB: solve the inverse kinematics at every point of
      `pawPath`, store each answer as a row of `qPath`, and use it as the guess
      for the next point.

      Why: The result is a smooth list of joint angles that takes the paw from
      the ready stance to the pad.

      Before you start, read Background and The function in the section Task 13
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            qPath is numeric with three columns and at least 15 rows; its first
            row is within 0.5 degree of [0 40 -80] and its last row within 0.5
            degree of [17.82 -14.45 -103.08]; the knee column is negative and
            inside -160 to +5 on every row; no joint jumps by more than about
            20 degrees between consecutive rows
      description: >
        qPath holds a smooth joint-angle path from the ready stance to the
        high-five pose.
    hints:
      - >
        The function: the loop calls `solve` once for each row of `pawPath`.
        The targets, outputs and initial guesses keep their roles between
        calls, so only the numbers change. Why: The result is a smooth list of
        joint angles that takes the paw from the ready stance to the pad. Your
        task, in MATLAB: solve the inverse kinematics at every point of
        `pawPath`, store each answer as a row of `qPath`, and use it as the
        guess for the next point. Type
        `for k = 1:n, qk = solve(ks,pawPath(k,:),guess); qPath(k,:) = qk(:)'; guess = qk(:)'; end`
        in the code area of this task in your live script, then run the section
        with `Ctrl+Enter`.
      - >
        If MATLAB reports an error inside the loop, check that the roles are
        still in place: the paw translation as targets, and the leg angles as
        outputs and as initial guesses.
      - >
        When it works, nothing is printed. The last row, `qPath(end,:)`, should
        be close to 17.8, -14.5 and -103.1 degrees.

  - id: "t14"
    title: Plot the path and replay the high-five with viewSolution
    involves: [command, output_interpretation]
    outcome_refs: [lo06]
    instruction: >
      Your task, in MATLAB: draw the three joint angles along the path in a
      figure with a legend. Then replay the move in the viewer: for every point
      of the path, solve again with the stored answer as the guess, show the
      pose and pause briefly. Place the Multibody Explorer window where you can
      see it before you run the section.

      Why: A sudden jump in a line would mean that a joint flipped between two
      neighbouring points. The replay shows the moment that the whole mission
      was for: Sprocket raises his paw from the ready stance to the pad.

      Before you start, read Background and The function in the section Task 14
      of your live script, sprocket_high_five.m. Type your code in the code
      area of that section, then run the section with `Ctrl+Enter`.

      Then answer this: Look at the three lines in your figure. Are they
      smooth, or does any line jump suddenly?
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            inspect all open figures, not only gcf, and find one with a legend
            and at least three plotted lines whose values match the three
            columns of the current qPath
        - kind: learner_confirmation
          check: >
            The learner says that the three lines are smooth, with no sudden
            jump, and that they saw Sprocket raise his paw to the pad in the
            viewer. If the learner did not see the paw move, ask them to place
            the Multibody Explorer window next to MATLAB and to run the replay
            loop again, with `pause(0.3)` if the move was too fast to see.
            Share the takeaway: a jump would mean that the knee flipped between
            two neighbouring points, and starting each search from the previous
            answer is what prevents it. Then congratulate the learner, because
            they have just watched Sprocket give a high-five, and close with a
            short summary of what they did: import, solver, frame variables,
            forward kinematics, inverse kinematics, initial guess, path.
      description: >
        A figure shows the three joint angles along the path, and the learner
        has watched Sprocket raise his paw to the pad in the viewer.
    hints:
      - >
        The function: `plot` draws one line for each column of `qPath`, and
        `legend` labels the lines. `viewSolution` redraws the viewer with the
        pose from the most recent `solve`. A loop that calls `solve` and then
        `viewSolution` for every point of the path plays the move. Each `solve`
        starts from the answer that you stored in `qPath`, so it finds the same
        pose again at once. `pause(0.1)` waits a tenth of a second so that you
        can see each pose. Why: A sudden jump in a line would mean that a joint
        flipped between two neighbouring points. The replay shows the moment
        that the whole mission was for: Sprocket raises his paw from the ready
        stance to the pad. Your task, in MATLAB: draw the three joint angles
        along the path in a figure with a legend. Then replay the move in the
        viewer: for every point of the path, solve again with the stored answer
        as the guess, show the pose and pause briefly. Place the Multibody
        Explorer window where you can see it before you run the section. Type
        `plot(s,qPath); legend("abduct","pitch","knee")`, then
        `for k = 1:n, solve(ks,pawPath(k,:),qPath(k,:)); viewSolution(ks); pause(0.1); end`
        in the code area of this task in your live script, then run the section
        with `Ctrl+Enter`.
      - >
        The names in `legend` are in the same order as the columns of `qPath`:
        hip abduction, hip pitch, knee. The viewer shows one pose for each call
        of `viewSolution`, so the replay loop needs `solve`, then
        `viewSolution`, then `pause` for every point. If the move is too fast
        to see, use `pause(0.3)`.
      - >
        A figure window opens with three smooth lines, and the knee line stays
        below zero from start to end. In the viewer, Sprocket lifts his
        front-left paw from the ready stance and presses it against the round
        pad, in 25 small steps.
