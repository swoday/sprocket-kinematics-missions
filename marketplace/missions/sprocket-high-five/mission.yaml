mission_id: "01"
version: "1.2.0"
title: Teach a Robot Dog to High-Five with KinematicsSolver
thumbnail: thumbnail.png
objective: >
  Sprocket is a robot dog, powered down on a maintenance stand, and your job
  is to teach him to give a high-five. You do not need any robotics
  background. A machine like Sprocket is a set of rigid parts connected by
  joints, and each joint angle is a single number. The Simscape Multibody
  KinematicsSolver works out how those joint angles and the position of his
  paw depend on each other. Forward kinematics asks where the paw ends up for
  joint angles that you choose. Inverse kinematics asks which joint angles put
  the paw on a point that you choose. By the end you will have imported
  Sprocket from his Computer-Aided Design (CAD) files, solved both problems,
  and picked the answer that his real joints can reach. This mission assumes
  only that you can type commands at the MATLAB prompt. You are never expected
  to know a command in advance. When the mission starts, a step-by-step guide
  named Sprocket_guide opens in the MATLAB Editor. It lists every step of
  every task: whether to work in MATLAB or in Simulink, the exact command,
  what the command does and why you need it. You can also ask Ada for a hint
  at any time, and each hint is one complete step. Before you begin, think
  about your own leg. When you bend your knee, does your foot move up or
  down?
supported_matlab_releases: [R2024b, R2025a, R2025b, R2026a, R2026b]
required_capabilities: [MATLAB, Simulink, Simscape, Simscape Multibody, MATLAB MCP, Simulink Agentic Toolkit]
write_mode: read_inspect
capability_mode: guided_tutor
teaching_mode: guided_walkthrough

app:
  summary: Import a robot dog from CAD and solve forward and inverse kinematics to make it give a high-five.
  audience: Anyone who can type MATLAB commands. No robotics, CAD or Simscape Multibody background is needed.
  difficulty: beginner
  estimated_minutes: 60
  products: [MATLAB, Simulink, Simscape, Simscape Multibody]
  topics: [kinematics, KinematicsSolver, forward kinematics, inverse kinematics, URDF import, initial guesses]
  status: draft
  learner_visible: true
  tile_order: 10

learning_outcomes:
  - id: lo01
    description: Import a URDF CAD assembly into a Simscape Multibody model and identify its joints.
  - id: lo02
    description: Create a KinematicsSolver object and match its joint variable IDs to the joints of the model.
  - id: lo03
    description: Define frame variables that measure the position of a point of interest relative to the world frame.
  - id: lo04
    description: Pose and solve a forward kinematics problem by assigning target and output variables.
  - id: lo05
    description: Pose and solve an inverse kinematics problem and read its status flag.
  - id: lo06
    description: Use initial guesses to choose between multiple solutions, check a solution against joint limits, and solve a smooth path.

setup:
  script: "setup_sprocket_high_five.m"
  description: >
    Finds the Sprocket CAD files that ship in the task_reset folder and writes
    Sprocket.urdf into the learner workspace with full paths to the part
    geometry, so the import works from any current folder. Leaves two
    variables in the MATLAB workspace: urdfFile, the full path of that URDF
    file, and padPosition, the 1-by-3 point in metres (world frame) that the
    paw centre must reach. It also copies the step-by-step guide
    Sprocket_guide.m into the learner workspace, opens it in the MATLAB
    Editor, and leaves its full path in the variable guideFile. No model is
    created and no solver exists yet. Construction variables are cleared. Run
    via run_matlab_file at session start.

runtime_validation:
  setup:
    assertions:
      - type: workspace_var
        name: padPosition
        class: double
      - type: workspace_var
        name: urdfFile
        class: string
      - type: matlab_expression
        description: The staged URDF file exists
        code: "isfile(urdfFile)"
      - type: matlab_expression
        description: The step-by-step guide was copied into the workspace
        code: "isfile(guideFile)"
      - type: workspace_absent
        name: cadFolder
  resets:
    - task: t02
      assertions:
        - type: model_loaded
          name: Sprocket
        - type: block_exists
          path: Sprocket/fl_knee
        - type: block_exists
          path: Sprocket/World
    - task: t03
      assertions:
        - type: model_loaded
          name: Sprocket
        - type: workspace_var
          name: ks
          class: simscape.multibody.KinematicsSolver
        - type: matlab_expression
          description: Three leg joint IDs are stored
          code: "numel(legIDs) == 3"
    - task: t04
      assertions:
        - type: workspace_var
          name: ks
          class: simscape.multibody.KinematicsSolver
        - type: matlab_expression
          description: Three Paw frame variables exist
          code: "height(frameVariables(ks)) == 3"
    - task: t05
      assertions:
        - type: matlab_expression
          description: Forward kinematics is posed with three targets and three outputs
          code: "height(targetVariables(ks)) == 3 && height(outputVariables(ks)) == 3"
        - type: matlab_expression
          description: The stance paw position matches the reference
          code: "norm(reshape(pawStance, 1, []) - [0.22 0.16 0.1829]) < 1e-3"
    - task: t06
      assertions:
        - type: matlab_expression
          description: Inverse kinematics has been solved once
          code: "numel(qFirst) == 3 && all(isfinite(qFirst))"
    - task: t07
      assertions:
        - type: matlab_expression
          description: Initial guess variables are assigned
          code: "height(initialGuessVariables(ks)) >= 2"
        - type: matlab_expression
          description: The high-five pose is on the knee-back branch
          code: "abs(qHighFive(3) + 103.08) < 0.1"

discovery:
  model_name:
    tool: evaluate_matlab_code
    code: "bdroot"
    note: >
      The learner imports the model and may give it any name. The default is
      Sprocket. Use bdroot or find_system('type','block_diagram') to discover
      it, or read the ModelName property of the learner's KinematicsSolver
      object once it exists. Use the discovered name in every block path.

# Notes for the tutor (Ada):
#
# Teaching style. The author wrote this mission as a guided walkthrough for
# learners who start from zero. Please read this before you present any task.
# The line teaching_mode: guided_walkthrough above marks that choice.
# - If your rules do not let you show the numbered steps when you present a
#   task, do not leave the learner with a goal alone. Say in one line that
#   every hint is a complete step with the exact command, and invite them to
#   ask for the first one straight away. Never assume that the learner knows
#   which function to use or where to click.
# - For the opening prediction question, use the question at the end of the
#   objective, about bending a knee. Do not ask what the solver will do.
# - The setup script opens a guide named Sprocket_guide.m in the learner's
#   MATLAB Editor. It holds the same numbered steps as the instructions, one
#   section per step, under the headings TASK 1 to TASK 7. When you present
#   a task, tell the learner which TASK heading to look at. The guide is the
#   learner's own copy, so they may run its sections and write notes in it.
# - Present every task instruction in full: the story, the explanation of
#   the new idea, the numbered steps with their commands, and the question.
#   The numbered steps and commands are the learner-facing task as the
#   author intends it. They are not a hidden solution, so do not shorten
#   them, summarise them or leave the commands out.
# - Keep the numbered list as a numbered list, and keep every command in
#   code formatting so that the learner can copy it.
# - Every step has the same four pieces, and the learner needs all four:
#   where to work (In MATLAB or In Simulink), the action or command, what
#   it does, and why. Keep those labels. Do not assume that the learner
#   knows any MATLAB function, any Simulink term or any mechanical term.
#   When a function appears for the first time, say in one plain sentence
#   what it does and what its inputs mean, even if the step already did.
# - In MATLAB means the Command Window, after the >> prompt. In Simulink
#   means the window that shows the Sprocket block diagram. If the learner
#   cannot find one of them, help with that first.
# - Help first. If the learner asks to go one step at a time, do that. After
#   each step that the learner runs, say in one or two plain sentences what
#   the result on their screen means.
# - The hints repeat the steps with more detail and the usual mistakes.
#   Give them freely. If the learner says that they are new, or asks you to
#   show every step, treat that as a standing request for help for the rest
#   of the mission.
# - The learner uses viewSolution to look at Sprocket after every solve.
#   If they skip it, remind them, because seeing the pose is the point.
# - Ask fair questions only. A fair question has one idea, and the learner
#   can answer it from what this mission has already shown them or from
#   everyday experience. Ask one question at a time. If the learner
#   hesitates, offer two or three choices. This also applies to the opening
#   prediction question: ask about something familiar, such as how many
#   numbers it takes to describe the pose of a leg with three hinges.
# - When an answer is not right, never just say that it is wrong. Explain in
#   one or two supportive sentences why the right answer is right, then
#   invite the learner to try again or to move on.
# - A question about what a word means is not a hint request. Answer it in
#   full, in everyday language, at any time. Introduce a new term in four
#   moves: name it, define it, relate it to something familiar, then show
#   where it appears in Sprocket's model. Useful definitions:
#     part (also body or link). One rigid piece that does not bend.
#     joint. The place where two parts meet and can move. A revolute joint
#       is a hinge with one angle. A weld joint allows no motion.
#     degrees of freedom (DOF). The number of independent ways to move. A
#       leg with three hinges has three.
#     pose. The full list of joint angles at one moment.
#     frame. A coordinate system attached to a part, an origin and x, y, z.
#     world frame. The frame that never moves. Here it sits on the floor
#       under the middle of Sprocket's body, x forward, y to his left, z up.
#     kinematics. The geometry of motion, with no forces or motors.
#     forward kinematics. Joint angles in, position out. One answer.
#     inverse kinematics. Position in, joint angles out. The solver finds it
#       by search, and there can be more than one answer.
#     target, output, initial guess. The three roles of a solver variable.
#       A value you supply, a value you want, and where the search starts.
#     status flag. How the search went. 1 means every target was met.
# - When a task is complete, congratulate the learner, give a one-sentence
#   takeaway in their terms, and link it to the next part of the story.
# - Write to the learner as "you", in active voice, and use no jargon that
#   this mission has not explained.
#
# Checking the work.
# - Every check below can be answered with evaluate_matlab_code. Find the
#   learner's solver by class (simscape.multibody.KinematicsSolver), not by
#   variable name, and inspect it with jointPositionVariables,
#   frameVariables, targetVariables, outputVariables and
#   initialGuessVariables. These calls only read the solver.
# - Reference answers come from an independent calculation on the same URDF.
#   Lengths are in metres, angles in degrees. Treat them as sanity anchors
#   and judge the learner's formulation first.
# - The solver ignores joint limits. That is the point of Task 6, so do not
#   reveal it before then.
# - Calling solve yourself changes which pose viewSolution shows. If you call
#   it to verify, say so, or re-run the learner's last solve afterwards.

tasks:
  - id: "t01"
    title: Bring Sprocket into Simscape Multibody
    involves: [command, output_interpretation]
    outcome_refs: [lo01]
    instruction: >
      Meet Sprocket. He is a robot dog, powered down on a maintenance stand
      with his legs hanging straight. Engineers describe a machine like him
      as rigid parts connected by joints. A joint is the place where two
      parts meet and can move, like a door hinge or your knee, and one number
      describes each hinge: its angle. Sprocket was designed in a
      Computer-Aided Design (CAD) program, and the design was saved in the
      Unified Robot Description Format (URDF), a plain text file that lists
      every part and every joint. Before MATLAB can reason about his joints,
      that file has to become a Simscape Multibody model, which is a block
      diagram with one block for each part and one block for each joint.

      You will work in two places. The MATLAB Command Window is where you
      type commands after the >> prompt. Simulink is the window that shows a
      model as a diagram of blocks. Every step tells you which one to use,
      what the command does and why you need it.

      The guide that is open in the MATLAB Editor shows the same steps, under
      the heading for this task.

      Your steps:

      1. In MATLAB: type `smimport(urdfFile)` in the Command Window and press
      Enter. What it does: smimport is the import function of Simscape
      Multibody. It reads a robot description file and builds a model from
      it. The name urdfFile is a variable, which is a stored value, and it
      already holds the location of Sprocket's file. Why: MATLAB can only
      reason about Sprocket once he exists as a model. After a few seconds, a
      Simulink window named Sprocket opens.

      2. In Simulink: click an empty area of the Sprocket window, then press
      Ctrl+D (Cmd+D on a Mac). What it does: this updates the model. Simulink
      assembles all the parts and opens a 3D view called Mechanics Explorer.
      Why: you can see what you just imported. Drag with the mouse to look
      around Sprocket.

      3. In Simulink: go back to the block diagram and find the blocks whose
      names start with fl_. What you see: the letters fl stand for
      front-left, and four of those blocks are joints. Their names are
      fl_hip_abduct, fl_hip_pitch, fl_knee and fl_foot. Why: these are the
      joints that you will control for the rest of the mission.

      Then answer this: three of those four joints are hinges that move the
      leg, and one is a rigid weld that only holds the paw on. Think about
      your own leg. Which three do you think are the hinges? Tell me their
      names.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            a block diagram imported from Sprocket.urdf is loaded: list models
            with find_system("type","block_diagram") and confirm one of them
            has top-level blocks named World, fl_hip_abduct, fl_hip_pitch,
            fl_knee and fl_foot (for example with getSimulinkBlockHandle);
            accept any model name
        - tool: model_overview
          check: >
            the imported model's top level shows link subsystems connected by
            joint blocks; if the model tools cannot describe physical-network
            blocks, rely on the evaluate_matlab_code evidence instead of
            failing the task
        - kind: learner_confirmation
          check: >
            The learner has named the three joints of the front-left leg:
            fl_hip_abduct, fl_hip_pitch and fl_knee. Accept an answer in their
            own words that identifies all three.
      description: >
        Sprocket.urdf has been imported as a loaded Simscape Multibody model
        and the learner has identified the three front-left leg joints.
    hints:
      - >
        First step, in MATLAB. Click in the Command Window, type
        `smimport(urdfFile)` and press Enter. What it does: smimport is the
        import function of Simscape Multibody. It reads the robot description
        file and builds a model from it. The name urdfFile is a variable that
        already holds the location of the file, so type it with no quotes.
        Why: MATLAB can only reason about Sprocket once he exists as a model.
        A Simulink window named Sprocket opens after a few seconds. Ask for
        the next hint when you see it.
      - >
        Second step, in Simulink. Click an empty area of the Sprocket window
        and press Ctrl+D (Cmd+D on a Mac). You can also open the Modeling tab
        and select Update Model. What it does: Simulink assembles all the
        parts and opens a 3D view called Mechanics Explorer. Why: you can see
        what you just imported. Drag with the mouse to look around Sprocket,
        then ask for the next hint.
      - >
        Third step, in Simulink. Go back to the block diagram and find the
        blocks whose names start with fl_, which stands for front-left. What
        you see: four of them are joints. The joint fl_hip_abduct swings the
        whole leg sideways, fl_hip_pitch swings it forward and back, and
        fl_knee bends the lower leg. The fourth, fl_foot, is the weld that
        holds the paw on. So the three hinges are fl_hip_abduct, fl_hip_pitch
        and fl_knee. Tell me those three names to finish the task.

  - id: "t02"
    title: Create the solver and find the leg joints
    involves: [command, output_interpretation]
    outcome_refs: [lo02]
    instruction: >
      Sprocket is in MATLAB now, but he is only a drawing. To ask questions
      about his geometry you need a KinematicsSolver. Think of it as a
      geometry calculator. It takes a snapshot of the model and works out how
      the joint angles and the positions of the parts relate, without running
      a simulation. The solver keeps its own list of every joint angle.
      However, it does not use the joint names. It gives each angle a short
      ID of its own, such as j5.Rz.q, which reads as joint 5, rotation about
      the z axis of that joint, position. Before you can move the front-left
      leg, you have to find out which IDs belong to it.

      The guide that is open in the MATLAB Editor shows the same steps, under
      the heading for this task.

      Your steps:

      1. In MATLAB: type
      `ks = simscape.multibody.KinematicsSolver("Sprocket");` and press
      Enter. What it does: KinematicsSolver creates the geometry calculator
      for the model whose name is in quotes. The prefix simscape.multibody is
      the name of the package, a kind of folder, where MATLAB keeps this
      function. The result is stored in the variable ks, and the semicolon at
      the end stops MATLAB from printing it. Why: every later command needs
      ks.

      2. In MATLAB: type `T = jointPositionVariables(ks)` with no semicolon,
      so that MATLAB prints the result. What it does: jointPositionVariables
      asks the solver for a table of every joint angle that it knows. Each
      row is one joint angle. The ID column is the solver's name for the
      angle. The BlockPath column tells you which joint block in the Simulink
      model the angle belongs to. Why: you need the IDs of the three
      front-left joints.

      3. In MATLAB: find the three rows whose BlockPath ends in
      fl_hip_abduct, fl_hip_pitch and fl_knee. If they are the first three
      rows, type `legIDs = T.ID(1:3)`. What it does: T.ID takes the ID column
      of the table, and the numbers in parentheses keep rows 1 to 3.
      Otherwise use the row numbers that you found, for example
      `legIDs = T.ID([4 5 6])`. Why: legIDs is now your shortcut for the
      three leg angles, in the order hip abduction, hip pitch, knee.

      Then answer this: look at the Unit column of the table. Which unit does
      the solver use for joint angles?
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            the base workspace holds a simscape.multibody.KinematicsSolver
            object whose ModelName is a currently loaded model; find it by
            class with whos and do not require a particular variable name
        - tool: evaluate_matlab_code
          check: >
            legIDs exists and holds exactly three IDs; look each one up in the
            table returned by jointPositionVariables for the learner's solver
            and confirm the BlockPath values end with fl_hip_abduct,
            fl_hip_pitch and fl_knee in that order; never assume the IDs are
            j1, j2, j3
        - kind: learner_confirmation
          check: >
            The learner states that joint position variables are in degrees
            by default.
      description: >
        A KinematicsSolver object exists for the imported model and legIDs
        holds the variable IDs of the three front-left leg joints in order.
    hints:
      - >
        First step, in MATLAB. Type
        `ks = simscape.multibody.KinematicsSolver("Sprocket");` and press
        Enter. What it does: KinematicsSolver creates the geometry calculator
        for the model whose name is in quotes, and stores it in the variable
        ks. The semicolon stops MATLAB from printing the result, so nothing
        visible happens. Why: every later command needs ks. If MATLAB reports
        an error, check that the Sprocket window is still open and that the
        name in quotes matches its title.
      - >
        Second step, in MATLAB. Type `T = jointPositionVariables(ks)` with no
        semicolon, so that MATLAB prints the result. What it does:
        jointPositionVariables asks the solver for a table of every joint
        angle that it knows. Each row is one joint angle. The ID column is the
        solver's name for the angle, the BlockPath column names the joint
        block in the Simulink model, and the Unit column gives the unit. Why:
        you need the IDs of the three front-left joints.
      - >
        Third step, in MATLAB. Type `T(1:3,:)` and check that the BlockPath
        values end in fl_hip_abduct, fl_hip_pitch and fl_knee, in that order.
        If they do, type `legIDs = T.ID(1:3)`. What it does: T.ID takes the ID
        column of the table, and the numbers in parentheses keep rows 1 to 3.
        If the three joints are on other rows, use those row numbers, for
        example `legIDs = T.ID([4 5 6])`. The Unit column shows deg, which
        means degrees. Tell me the unit to finish the task.

  - id: "t03"
    title: Tell the solver where the paw is
    involves: [command, configuration]
    outcome_refs: [lo03]
    instruction: >
      The solver knows every joint angle now. However, it does not know which
      point on Sprocket you care about. Positions are measured with frames. A
      frame is a small coordinate system attached to a part: an origin point
      and three axes named x, y and z. Think of a frame as a combination of a
      GPS and a compass. It tells you where a part is and which way it is
      facing. One frame never moves, and it is called the world frame. It
      sits on the floor under the middle of Sprocket's body, with x pointing
      forward, y pointing to his left and z pointing up. To track the paw,
      you ask the solver to measure the frame of the paw from the world
      frame. That measurement is called a frame variable.

      The guide that is open in the MATLAB Editor shows the same steps, under
      the heading for this task.

      Your steps:

      1. In Simulink: in the Sprocket block diagram, find the block named
      World and the joint block named fl_foot. Look at the small letters on
      those blocks. What you see: each letter marks a port, and each port is
      a frame. The world frame is port W of the World block. The joint
      fl_foot holds the paw on, and its port F sits at the centre of the paw.
      Why: the next command needs the names of these two frames.

      2. In MATLAB: type
      `addFrameVariables(ks,"Paw","translation","Sprocket/World/W","Sprocket/fl_foot/F");`
      and press Enter. What it does: addFrameVariables tells the solver to
      measure one frame from another. Its five inputs are the solver, a group
      name of your choice, the kind of measurement, the frame to measure from
      and the frame to measure to. You write a frame as the model name, the
      block name and the port name, with slashes between them. The word
      translation means the distances along x, y and z. Why: the solver can
      now report where the paw is.

      3. In MATLAB: type `frameVariables(ks)`. What it does: frameVariables
      lists the measurements that the solver knows. Three new rows appear:
      Paw.Translation.x, Paw.Translation.y and Paw.Translation.z, in metres.
      Why: you will use these three IDs in the next task.

      Then answer this: if Sprocket lifts his paw straight up, which of those
      three numbers changes: x, y or z?
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            frameVariables for the learner's solver lists three translation
            variables (x, y, z, in metres) whose Base is the W port of the
            World block and whose Follower is a frame at the paw centre: the F
            or B port of the fl_foot joint, or an equivalent frame port on the
            fl_paw subsystem; accept any valid group name; do not accept a
            follower on another leg or on the knee joint
        - kind: learner_confirmation
          check: >
            The learner says that z changes when the paw moves straight up.
            The reason is that the z axis of the world frame points up. If the
            learner picks x or y, explain that kindly and move on.
      description: >
        The solver has a group of three translation frame variables that
        locate the front-left paw relative to the world frame.
    hints:
      - >
        First step, in Simulink. In the Sprocket block diagram, find the block
        named World and the joint block named fl_foot, and look at the small
        letters on them. What you see: each letter marks a port, and each port
        is a frame. The world frame is port W of the World block. Port F of
        fl_foot sits at the centre of the paw. Why: the next command needs
        both frames. You write a frame as the model name, the block name and
        the port name, with slashes between them.
      - >
        Second step, in MATLAB. Type
        `addFrameVariables(ks,"Paw","translation","Sprocket/World/W","Sprocket/fl_foot/F");`
        and press Enter. What it does: addFrameVariables tells the solver to
        measure one frame from another. Its five inputs are the solver, a
        group name of your choice, the kind of measurement, the frame to
        measure from and the frame to measure to. Why: the solver can now
        report where the paw is. If MATLAB reports an error, check the quotes
        and the spelling of both paths.
      - >
        Third step, in MATLAB. Type `frameVariables(ks)`. What it does:
        frameVariables lists the measurements that the solver knows. You
        should see Paw.Translation.x, Paw.Translation.y and Paw.Translation.z,
        in metres. The answer to the question is z, because the z axis of the
        world frame points up. Tell me that answer to finish the task.

  - id: "t04"
    title: Move into the ready stance with forward kinematics
    involves: [command, output_interpretation]
    outcome_refs: [lo04]
    instruction: >
      Time to wake him up. When every joint is at 0 degrees, Sprocket hangs
      straight, so each angle tells you how far a joint has turned from that
      pose. In his ready stance, the front-left leg has fl_hip_abduct at 0,
      fl_hip_pitch at 40 and fl_knee at -80 degrees. Working out where the
      paw ends up for joint angles that you already know is called forward
      kinematics. It is the easy direction. Bend your own knee by a known
      amount, and there is exactly one place where your foot can be. The
      solver needs you to give every variable a role. A target is a variable
      whose value you supply. An output is a variable that the solver
      calculates for you.

      Before you start, make a prediction. With the leg hanging straight, the
      paw is as low as it can go. Will bending the joints make the paw end up
      higher or lower? Tell me your guess.

      The guide that is open in the MATLAB Editor shows the same steps, under
      the heading for this task.

      Your steps:

      1. In MATLAB: type `addTargetVariables(ks,legIDs);`. What it does:
      addTargetVariables marks variables as targets, which are the values
      that you will supply. Here the targets are the three leg angles. Why:
      in a forward problem you know the angles.

      2. In MATLAB: type `pawIDs = "Paw.Translation." + ["x";"y";"z"];` and
      then `addOutputVariables(ks,pawIDs);`. What it does: the first command
      builds the three paw IDs by joining the same text to x, y and z. The
      second command, addOutputVariables, marks them as outputs, which are
      the values that the solver calculates for you. Why: in a forward
      problem you want the paw position.

      3. In MATLAB: type `[pawStance,status] = solve(ks,[0 40 -80])` with no
      semicolon. What it does: solve runs the calculation. The numbers in
      square brackets are the target values, in the same order as legIDs: 0
      for hip abduction, 40 for hip pitch and -80 for the knee. Two results
      come back. The first, pawStance, holds the x, y and z of the paw in
      metres. The second, status, is 1 when the solver met every target. Why:
      this is the answer to the forward problem.

      4. In MATLAB: type `viewSolution(ks)`. What it does: viewSolution opens
      a 3D viewer that shows Sprocket in the pose that the solver just found.
      Why: numbers are hard to picture, and the viewer lets you check the
      pose with your own eyes. Use it after every solve from now on.

      Then answer this: hanging straight, the paw was at a height of z = 0.08
      metres. Compare that with the third number in pawStance. Was your
      prediction right?
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            targetVariables for the learner's solver lists exactly the three
            front-left leg joint position variables, and outputVariables
            lists the three Paw translation variables
        - tool: evaluate_matlab_code
          check: >
            pawStance is a three-element numeric vector within 1 mm of
            [0.2200 0.1600 0.1829] metres; to judge the formulation rather
            than the stored numbers you may call solve on the learner's
            solver with the targets 0, 40 and -80 in the order shown by
            targetVariables and expect a status flag of 1
        - kind: learner_confirmation
          check: >
            The learner compares the third number of pawStance, about 0.18,
            with the hanging height of 0.08 and says that the paw is higher.
            Accept any answer that recognises the paw rose. Then share the
            rest as a takeaway instead of asking for it: the paw rose by
            about 0.10 m and stayed directly below the hip, so x and y did
            not change.
      description: >
        A forward kinematics problem is posed with the leg joints as targets
        and the paw translation as outputs, and pawStance holds the solved
        paw position for the ready stance.
    hints:
      - >
        First step, in MATLAB. Type `addTargetVariables(ks,legIDs);` and press
        Enter. Then type `pawIDs = "Paw.Translation." + ["x";"y";"z"];` and
        `addOutputVariables(ks,pawIDs);`. What it does: addTargetVariables
        marks the three leg angles as targets, which are the values that you
        supply. The middle command builds the three paw IDs. Then
        addOutputVariables marks the paw position as the output, which is the
        value that the solver calculates. Why: in a forward problem you know
        the angles and you want the paw position.
      - >
        Second step, in MATLAB. Type
        `[pawStance,status] = solve(ks,[0 40 -80])` with no semicolon. What it
        does: solve runs the calculation. The numbers in square brackets are
        the target values in the same order as legIDs: 0 for hip abduction, 40
        for hip pitch and -80 for the knee. Two results come back. The first,
        pawStance, holds the x, y and z of the paw in metres. The second,
        status, is 1 when the solver met every target. Why: this is the answer
        to the forward problem.
      - >
        Third step, in MATLAB. Type `viewSolution(ks)`. What it does:
        viewSolution opens a 3D viewer that shows Sprocket in the pose that
        the solver just found. Why: the viewer lets you check the pose with
        your own eyes. Now compare the third number of pawStance, about 0.18,
        with the hanging height of 0.08. The paw is about 0.10 metres higher.
        Tell me whether your prediction was right to finish the task.

  - id: "t05"
    title: Reach the pad with inverse kinematics
    involves: [command, output_interpretation]
    outcome_refs: [lo05]
    instruction: >
      Now flip the question. A trainer has fixed a high-five pad to the
      stand. The point that the paw has to reach is stored in padPosition:
      three numbers, x, y and z in metres, measured in the world frame. This
      time you know where the paw should be, and you want the joint angles
      that put it there. That is inverse kinematics. Every robot has to
      answer this question before it can touch anything. It is also the hard
      direction, because the solver cannot calculate the angles directly.
      Instead, it searches. It adjusts the angles a little at a time until
      the paw lands on the target. A number called the status flag tells you
      how the search went.

      The guide that is open in the MATLAB Editor shows the same steps, under
      the heading for this task.

      Your steps:

      1. In MATLAB: type
      `clearTargetVariables(ks); clearOutputVariables(ks);`. What it does:
      these two functions remove the roles that you assigned in the forward
      problem. The variables themselves stay. Why: a variable can have only
      one role at a time, and you are about to swap the roles.

      2. In MATLAB: type `addTargetVariables(ks,pawIDs);` and then
      `addOutputVariables(ks,legIDs);`. What it does: these are the same two
      functions as before, with the lists swapped. Why: the paw position is
      now what you know, and the leg angles are what you want.

      3. In MATLAB: type `[qFirst,status] = solve(ks,padPosition)`. What it
      does: solve searches for joint angles that put the paw on the point
      stored in padPosition. The result qFirst holds three angles in degrees,
      in the order of legIDs: hip abduction, hip pitch and knee. Why: these
      are the angles that the motors in the leg would have to reach.

      4. In MATLAB: type `viewSolution(ks)`, then look at the viewer. What it
      does: it shows the pose where the search ended. Why: you can see
      whether the paw touches the pad.

      Then answer this: which status flag did you get? A status of 1 means
      that the paw reached the pad. A negative status means that the search
      stopped before it got there. Tell me which one you see.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            targetVariables for the learner's solver lists exactly the three
            Paw translation variables and outputVariables lists the three
            front-left leg joint position variables, so the roles from the
            forward problem have been cleared and swapped
        - tool: evaluate_matlab_code
          check: >
            qFirst is a three-element numeric vector; two answers are both
            correct here, close to [17.82 -14.45 -103.08] or
            [17.82 -117.53 103.08] degrees (allow 0.1 degree and full-turn
            wraps); if the learner's solve started from the straight-leg pose
            and returned a negative status flag, do not fail the task as long
            as the roles are right, because Task 6 fixes convergence with
            initial guesses
        - kind: learner_confirmation
          check: >
            The learner reports the status flag that they got and what it
            means: 1 means the paw reached the pad, a negative value means the
            search stopped early. Accept either outcome. Both are fine here.
      description: >
        An inverse kinematics problem is posed with the paw translation as
        targets and the leg joints as outputs, and qFirst holds the joint
        angles the solver returned for the pad position.
    hints:
      - >
        First step, in MATLAB. Type
        `clearTargetVariables(ks); clearOutputVariables(ks);` and press Enter.
        Then type `addTargetVariables(ks,pawIDs);` and
        `addOutputVariables(ks,legIDs);`. What it does: the first line removes
        the roles from the forward problem, and the next two assign them the
        other way round. Why: a variable can have only one role at a time. The
        paw position is now what you know, and the leg angles are what you
        want. If MATLAB says that pawIDs does not exist, type
        `pawIDs = "Paw.Translation." + ["x";"y";"z"];` first.
      - >
        Second step, in MATLAB. Type `[qFirst,status] = solve(ks,padPosition)`
        with no semicolon. What it does: solve searches for joint angles that
        put the paw on the point stored in padPosition. The result qFirst
        holds three angles in degrees, in the order of legIDs: hip abduction,
        hip pitch and knee. The result status is 1 when the paw reached the
        pad, and negative when the search stopped early. Why: these are the
        angles that the motors in the leg would have to reach.
      - >
        Third step, in MATLAB. Type `viewSolution(ks)` and look at the paw in
        the viewer. What it does: it shows the pose where the search ended.
        Then tell me the status flag that you got. Both outcomes are fine
        here. If the status is negative, the search started from straight
        legs and lost its way, and the next task shows you how to guide it.

  - id: "t06"
    title: Pick the pose the real joints can reach
    involves: [command, output_interpretation]
    outcome_refs: [lo05, lo06]
    instruction: >
      Look at the knee in the solution viewer. The paw can reach the pad in
      two ways: with the knee tucked back behind the leg, as in the ready
      stance, or with the knee flipped forward above the body. You can feel
      the same thing with your own arm. Put a fingertip on the table and move
      your elbow up and down. The fingertip stays where it is, yet your joint
      angles change. The solver only does geometry, so it ignores joint
      limits. However, the real knee can move only between -160 and +5
      degrees, so only one of the two answers is real. The solver starts its
      search from a pose and stops at the first answer that it finds. An
      initial guess is a starting pose that you choose, so that the search
      ends at the answer that you want.

      The guide that is open in the MATLAB Editor shows the same steps, under
      the heading for this task.

      Your steps:

      1. In MATLAB: type `qFirst` and press Enter. What it does: typing the
      name of a variable prints its value. The third number is the knee
      angle. If it is greater than +5, the knee has flipped forward, past its
      limit. Why: the solver does not check joint limits, so you have to.

      2. In MATLAB: type `addInitialGuessVariables(ks,legIDs);`. What it
      does: addInitialGuessVariables gives the leg angles a third role,
      initial guess, which is the pose where the search starts. Why: a search
      that starts near the answer that you want ends at that answer.

      3. In MATLAB: type
      `[qHighFive,status] = solve(ks,padPosition,[0 40 -80])`. What it does:
      solve now has a third input, the guess. The values 0, 40 and -80 are
      the ready stance, where the knee already bends the right way. Why:
      starting from the ready stance leads the search to the answer with the
      knee tucked back.

      4. In MATLAB: type `viewSolution(ks)` and look at the knee in the
      viewer. What to check: the knee angle, the third number in qHighFive,
      should be close to -103 degrees, which is inside the limit.

      Then answer this: why can the same paw position have two different sets
      of joint angles? Use the fingertip and elbow example if it helps.
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            initialGuessVariables for the learner's solver includes at least
            the front-left hip pitch and knee joint position variables
        - tool: evaluate_matlab_code
          check: >
            qHighFive is a three-element numeric vector within 0.1 degree of
            [17.82 -14.45 -103.08], in the order of the output table, so the
            knee angle is negative and inside the range -160 to +5 degrees
        - kind: learner_confirmation
          check: >
            The learner explains in their own words that a two-segment leg
            can reach the same point with the knee bent either way, so the
            paw position alone does not fix the joint angles. Accept the
            elbow comparison as a full answer.
      description: >
        The leg joints are assigned as initial guess variables and qHighFive
        holds the knee-back solution that respects the knee joint limit.
    hints:
      - >
        First step, in MATLAB. Type `qFirst` and press Enter, then type
        `viewSolution(ks)`. What it does: typing the name of a variable prints
        its value, and the viewer shows the same pose. The third number of
        qFirst is the knee angle. The real knee can move only between -160 and
        +5 degrees. A knee angle near +103 is the flipped answer, and one near
        -103 is the real one. Why: the solver does not check joint limits, so
        you have to.
      - >
        Second step, in MATLAB. Type `addInitialGuessVariables(ks,legIDs);`
        and press Enter. What it does: addInitialGuessVariables gives the leg
        angles a third role, initial guess, which is the pose where the search
        starts. Why: a search that starts near the answer that you want ends
        at that answer.
      - >
        Third step, in MATLAB. Type
        `[qHighFive,status] = solve(ks,padPosition,[0 40 -80])` and then
        `viewSolution(ks)`. What it does: solve now has a third input, the
        guess. The values 0, 40 and -80 are the ready stance, where the knee
        already bends the right way. The answer should be close to 17.8, -14.5
        and -103.1 degrees. Two answers exist because a leg with two segments
        can reach the same point with the knee bent either way, just like
        your elbow. Tell me that in your own words to finish the task.

  - id: "t07"
    title: Plan the move from stance to high-five
    involves: [command, file_edit, output_interpretation]
    outcome_refs: [lo06]
    instruction: >
      A real robot cannot jump from one pose to another. It has to pass
      through every pose in between, so your last job is to plan the move. A
      path is simply many inverse kinematics problems in a row, one for each
      point between where the paw is and where it needs to be. If each search
      starts from the previous answer, neighbouring answers stay close
      together, and the knee never flips. You need at least 15 points on the
      straight line from pawStance to padPosition. Store the joint angles for
      each point in a matrix named qPath. Finish with a figure and a legend
      that show the three angles along the path.

      The guide that is open in the MATLAB Editor shows the same steps, under
      the heading for this task.

      Your steps:

      1. In MATLAB: type `n = 25; s = linspace(0,1,n)';`. What it does: n is
      the number of points. The function linspace makes n evenly spaced
      numbers from 0 to 1, and the apostrophe turns that row into a column.
      Why: s says how far along the path each point is, from 0 at the start
      to 1 at the end.

      2. In MATLAB: type
      `pawPath = (1-s).*pawStance(:)' + s.*padPosition(:)';`. What it does:
      this blends the two positions. When s is 0 you get pawStance, and when
      s is 1 you get padPosition. In between, you get points on the straight
      line that joins them. Each row of pawPath is one point. Why: these are
      the 25 places where the paw has to be.

      3. In MATLAB: type `qPath = zeros(n,3); guess = [0 40 -80];`. What it
      does: zeros makes a grid of zeros with n rows and 3 columns, ready for
      the answers. The variable guess holds the ready stance as the first
      starting pose. Why: the loop in the next step fills qPath row by row.

      4. In MATLAB: type
      `for k = 1:n, qk = solve(ks,pawPath(k,:),guess); qPath(k,:) = qk(:)'; guess = qk(:)'; end`
      on one line. What it does: a for loop repeats its commands, here once
      for each point. Each pass solves one point, stores the three angles as
      row k of qPath, and keeps them as the guess for the next point. Why:
      starting each search from the previous answer keeps the motion smooth.

      5. In MATLAB: type `plot(s,qPath); legend("abduct","pitch","knee")`.
      What it does: plot draws one line for each column of qPath, and legend
      labels the three lines. Why: the figure shows how each joint angle
      changes along the move.

      6. In MATLAB: type `viewSolution(ks)`. What you see: Sprocket in the
      last pose of the path, giving you a high-five.

      Then answer this: look at the three lines in your figure. Are they
      smooth, or does any line jump suddenly?
    completion:
      strategy:
        - tool: evaluate_matlab_code
          check: >
            qPath is numeric with three columns and at least 15 rows; its
            first row is within 0.5 degree of [0 40 -80] and its last row
            within 0.5 degree of [17.82 -14.45 -103.08]; the knee column is
            negative and inside -160 to +5 on every row; no joint jumps by
            more than about 20 degrees between consecutive rows
        - tool: evaluate_matlab_code
          check: >
            inspect all open figures, not only gcf, and find one with a legend
            and at least three plotted lines whose values match the three
            columns of the current qPath
        - kind: learner_confirmation
          check: >
            The learner says that the three lines are smooth, with no sudden
            jump. Then share the takeaway: a jump would mean that the knee
            flipped between two neighbouring points, and starting each search
            from the previous answer is what prevents it.
      description: >
        qPath holds a smooth joint-angle path from the ready stance to the
        high-five pose, and a figure shows the three joint angles along it.
    hints:
      - >
        First step, in MATLAB. Type `n = 25; s = linspace(0,1,n)';` and then
        `pawPath = (1-s).*pawStance(:)' + s.*padPosition(:)';`. What it does:
        linspace makes 25 evenly spaced numbers from 0 to 1, and the
        apostrophe turns that row into a column. The second command blends the
        two positions. Each row of pawPath is one point on the straight line
        from pawStance to padPosition. Why: these are the 25 places where the
        paw has to be. Type `size(pawPath)` to check for 25 rows and 3
        columns.
      - >
        Second step, in MATLAB. Type `qPath = zeros(n,3); guess = [0 40 -80];`
        and then, on one line,
        `for k = 1:n, qk = solve(ks,pawPath(k,:),guess); qPath(k,:) = qk(:)'; guess = qk(:)'; end`.
        What it does: zeros makes a grid with 25 rows and 3 columns for the
        answers. A for loop repeats its commands once for each point. Each
        pass solves one point, stores the three angles as a row of qPath, and
        keeps them as the guess for the next point. Why: starting each search
        from the previous answer keeps the motion smooth.
      - >
        Third step, in MATLAB. Type
        `plot(s,qPath); legend("abduct","pitch","knee")` and then
        `viewSolution(ks)`. What it does: plot draws one line for each column
        of qPath, legend labels the three lines, and the viewer shows the last
        pose. Sprocket should be giving you a high-five. The lines should be
        smooth, and the knee line should stay below zero. Tell me whether the
        three lines are smooth to finish the task.
